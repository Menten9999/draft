<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理者用 スライド操作パネル</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      overflow: hidden; user-select: none;
    }
    #slide-container {
      width: 100vw; height: calc(100vh - 80px);
      display: flex; align-items: center; justify-content: center;
      position: relative; background: #000;
    }
    .slide {
      position: absolute; width: 100%; height: 100%;
      opacity: 0; transition: opacity 1.2s ease;
      pointer-events: none;
    }
    .slide.active { opacity: 1; pointer-events: auto; }
    
    .team-logo-slide {
      width: 100%; height: 100%; background-size: contain; 
      background-position: center; background-repeat: no-repeat; background-color: #000;
    }
    .player-slide {
      background: #fff; color: #000; width: 100%; height: 100%;
      position: relative; display: flex; flex-direction: column; justify-content: center;
    }
    .ps-header { position: absolute; top: 0; left: 0; display: flex; align-items: center; }
    .ps-header-logo { height: 18vh; object-fit: contain; }
    .ps-header-team { font-size: 4vh; margin-left: 30px; letter-spacing: 0.1em; font-family: sans-serif;}
    .ps-player-name { font-size: 15vw; font-weight: bold; text-align: center; letter-spacing: 0.2em; margin-left: 0.2em; font-family: sans-serif;}
    .ps-footer { position: absolute; bottom: 10%; left: 8%; font-size: 4vw; line-height: 1.5; color: #333; font-family: sans-serif;}

    .summary-slide {
      width: 100%; height: 100%; background: #fff; color: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding-top: 2vh; box-sizing: border-box;
    }
    .summary-title { font-size: 4.5vh; margin-bottom: 2vh; letter-spacing: 0.05em; }
    .summary-grid {
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 1.5vw; width: 96vw; height: 85vh;
    }
    .grid-cell {
      position: relative; display: flex; flex-direction: column; 
      box-sizing: border-box; background: #fff;
    }
    .grid-cell.unrevealed {
      background-size: contain; background-position: center; background-repeat: no-repeat;
    }
    .cell-header { display: flex; align-items: center; height: 15%; margin-bottom: 3%; }
    .cell-logo { height: 100%; object-fit: contain; margin-right: 1vw; }
    .cell-team-name { font-size: 2.5vh; font-family: sans-serif;}
    .cell-player-name { font-size: 9vh; font-weight: bold; letter-spacing: 0.2em; text-align: center; margin-bottom: auto; font-family: sans-serif;}
    .cell-footer { font-size: 2.5vh; color: #333; line-height: 1.4; font-family: sans-serif;}

    #controls {
      height: 80px; width: 100%; background: #2C3E50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; box-sizing: border-box; position: fixed; bottom: 0; left: 0; z-index: 1000;
    }
    .ctrl-btn { padding: 10px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #fff; margin: 0 5px; }
    .btn-prev { background: #7f8c8d; }
    .btn-next { background: #E74C3C; }
    .btn-skip { background: #e67e22; }
    .btn-reset { background: #34495e; font-size: 14px; padding: 10px 15px; }
    .ctrl-btn:hover { opacity: 0.8; }
    #status-text { color: #fff; font-family: sans-serif; font-size: 16px; margin: 0 15px; }
  </style>
</head>
<body>

  <div id="slide-container">
    <div class="slide active" style="display:flex; align-items:center; justify-content:center; color:#fff;">
      <h1 style="font-family: sans-serif;">データを読み込み中...</h1>
    </div>
  </div>

  <div id="controls">
    <button class="ctrl-btn btn-prev" onclick="changeSlide(-1)">◀ 前</button>
    <div style="display: flex; align-items: center;">
      <button class="ctrl-btn btn-skip" onclick="changeSlide(2)">+2枚</button>
      <button class="ctrl-btn btn-skip" onclick="changeSlide(4)">+4枚</button>
      <button class="ctrl-btn btn-skip" onclick="changeSlide(6)">+6枚</button>
      <div id="status-text">スライド: -- / --</div>
      <button class="ctrl-btn btn-reset" onclick="resetSlide()">最初</button>
    </div>
    <button class="ctrl-btn btn-next" onclick="changeSlide(1)">次 ▶</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="../firebase-config.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="../firebase-config.js"></script>
  
  <script>
    let slidesData = [];
    let currentIndex = 0;
    let teamsData = [];
    let picksData = {};
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    db.ref('draftConfig/teams').on('value', (snap) => {
      teamsData = snap.val() || [];
      buildSlides();
    });

    db.ref('presentation/confirmed_picks').on('value', (snap) => {
      picksData = snap.val() || {};
      buildSlides();
    });

    db.ref('presentation/currentIndex').on('value', (snap) => {
      const index = snap.val();
      currentIndex = index !== null ? index : 0;
      renderSlide();
      if (typeof updateStatusText === 'function') updateStatusText();
    });

    function buildSlides() {
      // チーム情報が取得できていればそれを使用、なければ指名データのキーから自動推測する
      let teams = [];
      if (Array.isArray(teamsData) && teamsData.length > 0) {
        teams = teamsData;
      } else {
        const keys = Object.keys(picksData).sort();
        if (keys.length > 0) {
          keys.forEach(k => teams.push({ id: k, name: `チーム ${k}` }));
        } else {
          teams = [
            { id: "1", name: "橋本チーム" }, { id: "2", name: "西村チーム" },
            { id: "3", name: "チーム3" }, { id: "4", name: "チーム4" }
          ];
        }
      }

      const titleText = 'ピンポン野球サークル2026年度夏合宿ドラフト会議';
      const newSlides = [];
      
      newSlides.push({ html: '<div style="width:100%; height:100%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#000;"><h1 style="font-size: 6vw;">' + titleText + '</h1><p style="font-size:3vw; color:#666;">まもなく発表を開始します</p></div>' });

      // 指名データが存在するチームだけを抽出してスライド作成
      teams.forEach((team, index) => {
        // IDの型違い（数値の1と文字列の"1"など）を吸収してデータを取得
        const pickKey = Object.keys(picksData).find(k => k == team.id);
        const rawPick = pickKey ? picksData[pickKey] : null;
        
        if (rawPick) {
          // 元システムのデータは単なる文字列（選手名）で送られてくるため、文字列として処理する
          const playerName = typeof rawPick === 'string' ? rawPick : (rawPick.playerName || '未入力');
          const position = typeof rawPick === 'object' ? (rawPick.position || '') : '';
          const school = typeof rawPick === 'object' ? (rawPick.school || '') : '';

          const logoPath = `../assets/logo_${team.id}.jpg`;
          
          newSlides.push({ html: `<div class="team-logo-slide" style="background-image: url('${logoPath}');"></div>` });
          
          newSlides.push({
            html: `
              <div class="player-slide">
                <div class="ps-header">
                  <img src="${logoPath}" class="ps-header-logo" onerror="this.style.display='none'">
                  <div class="ps-header-team">${team.name || '未設定'}</div>
                </div>
                <div class="ps-player-name">${playerName}</div>
                <div class="ps-footer">
                  <div>${position}</div>
                  <div>${school}</div>
                </div>
              </div>
            `
          });

          // サマリー（一覧）スライドの構築
          let gridHtml = `<div class="summary-slide"><div class="summary-title">${titleText}</div><div class="summary-grid">`;
          teams.forEach((t, tIndex) => {
            const tPickKey = Object.keys(picksData).find(k => k == t.id);
            const tRawPick = tPickKey ? picksData[tPickKey] : null;
            const tLogoPath = `../assets/logo_${t.id}.jpg`;

            if (tIndex <= index && tRawPick) {
              const tPlayerName = typeof tRawPick === 'string' ? tRawPick : (tRawPick.playerName || '未入力');
              const tPosition = typeof tRawPick === 'object' ? (tRawPick.position || '') : '';
              const tSchool = typeof tRawPick === 'object' ? (tRawPick.school || '') : '';

              gridHtml += `
                <div class="grid-cell">
                  <div class="cell-header">
                    <img src="${tLogoPath}" class="cell-logo" onerror="this.style.display='none'">
                    <div class="cell-team-name">${t.name || '未設定'}</div>
                  </div>
                  <div class="cell-player-name">${tPlayerName}</div>
                  <div class="cell-footer">
                    <div>${tPosition}</div>
                    <div>${tSchool}</div>
                  </div>
                </div>
              `;
            } else {
              gridHtml += `<div class="grid-cell unrevealed" style="background-image: url('${tLogoPath}');"></div>`;
            }
          });
          gridHtml += `</div></div>`;
          newSlides.push({ html: gridHtml });
        }
      });
      
      newSlides.push({ html: '<div style="width:100%; height:100%; background:#fff; display:flex; align-items:center; justify-content:center;"><h1 style="font-size: 5vw; color: #333;">第一巡 選択希望選手<br>発表終了</h1></div>' });

      slidesData = newSlides;
      if (currentIndex >= slidesData.length) currentIndex = slidesData.length - 1;
      if (currentIndex < 0) currentIndex = 0;
      
      renderSlide();
      if (typeof updateStatusText === 'function') updateStatusText();
    }

    function renderSlide() {
      if (slidesData.length === 0) return;
      const container = document.getElementById('slide-container');
      const currentSlideHtml = slidesData[currentIndex].html;
      const oldSlide = container.querySelector('.slide.active');
      
      if (oldSlide && oldSlide.innerHTML === currentSlideHtml) return;
      if (oldSlide) oldSlide.classList.remove('active');

      const newSlide = document.createElement('div');
      newSlide.className = 'slide';
      newSlide.innerHTML = currentSlideHtml;
      container.appendChild(newSlide);
      
      setTimeout(() => {
        newSlide.classList.add('active');
        if(oldSlide) setTimeout(() => oldSlide.remove(), 1200);
      }, 50);
    }

    // 管理者用の操作機能（view画面では無視されます）
    function updateStatusText() {
      const el = document.getElementById('status-text');
      if(el) el.innerText = `スライド: ${currentIndex + 1} / ${slidesData.length}`;
    }

    function changeSlide(direction) {
      const nextIndex = currentIndex + direction;
      if (nextIndex >= 0 && nextIndex < slidesData.length) {
        db.ref('presentation').update({ currentIndex: nextIndex });
      }
    }

function changeSlide(direction) {
      const nextIndex = currentIndex + direction;
      if (nextIndex >= 0 && nextIndex < slidesData.length) {
        // 変更点: update ではなく特定のパスへ直接 set する
        db.ref('presentation/currentIndex').set(nextIndex);
      }
    }

    function resetSlide() {
      // 変更点: こちらも直接 set する
      db.ref('presentation/currentIndex').set(0);
    };
  </script>
</body>
</html>
